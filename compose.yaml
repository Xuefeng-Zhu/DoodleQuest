services:
  web:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["doodlequest-data:/data"]
    restart: unless-stopped
    init: true
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes: ["doodlequest-data:/data"]
    restart: unless-stopped
    init: true
volumes:
  doodlequest-data:
